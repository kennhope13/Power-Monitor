name: 🏗️ Build Thin Client Installer

on:
  # Chạy thủ công từ GitHub Actions tab
  workflow_dispatch:
    inputs:
      version:
        description: 'Phiên bản (VD: 3.0.1)'
        required: false
        default: '3.0.1'

  # Tự động build khi push tag v*
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: 🪟 Build Windows Installer
    runs-on: windows-latest

    steps:
      # 1. Checkout code
      - name: 📥 Checkout source
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 5. Install npm dependencies
      - name: 📦 Install npm dependencies
        working-directory: frontend
        run: npm ci

      # 6. Build thin client
      - name: 🏗️ Build thin client installer
        working-directory: frontend
        run: npm run electron:build:win

      # 7. Upload installer artifact
      - name: 📤 Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: station-monitor-thin-client-windows
          path: |
            frontend/dist-electron/*.exe
          retention-days: 30

      # 8. Tạo Release nếu push tag
      - name: 🚀 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Station Monitor ${{ github.ref_name }}
          body: |
            ## 📦 Station Monitor Thin Client Installer

            ### Cài đặt
            1. Tải file `Station Monitor_*_x64-setup.exe`
            2. Double-click → Next → Install → Finish
            3. Click icon **Station Monitor** trên Desktop
            4. Nhập địa chỉ IP máy chủ trạm điện → Kết nối

            ### Yêu cầu
            - Windows 10/11 (64-bit)
            - Kết nối mạng đến máy chủ trạm

          files: |
            frontend/dist-electron/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
