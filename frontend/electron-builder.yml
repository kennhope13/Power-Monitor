appId: com.stationmonitor.desktop
productName: Station Monitor
copyright: Copyright © 2025 StationOS Team
directories:
  output: dist-electron
files:
  - dist/**/*
  - electron/**/*
  - electron/loading.html
  - package.json
asarUnpack:
  - electron/loading.html
afterPack: ./scripts/afterPack.cjs
linux:
  target:
    - AppImage
  category: Utility
  maintainer: StationOS Team <support@stationos.com>
  icon: build/icon.png
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Station Monitor
