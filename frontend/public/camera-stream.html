<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100% !important; height:100% !important; background:#000; overflow:hidden; position: fixed; top: 0; left: 0; }
video-stream { position: absolute; inset: 0; display: block; width: 100% !important; height: 100% !important; }
video { width: 100% !important; height: 100% !important; object-fit: fill !important; display: block !important; position: absolute; inset: 0; }
video::-webkit-media-controls { display: none !important; }
video::--webkit-media-controls-enclosure { display: none !important; }
</style>
</head>
<body>
<script type="module">
import './video-stream.js';
const p = new URLSearchParams(location.search);
const src = p.get('src') || '';
const mode = p.get('mode') || 'webrtc,mse';
const go2rtc = p.get('go2rtc') || 'http://127.0.0.1:1984';
const el = document.createElement('video-stream');
el.mode = mode;
el.src = new URL('api/ws?src=' + encodeURIComponent(src), go2rtc);
document.body.appendChild(el);
</script>
</body>
</html>
