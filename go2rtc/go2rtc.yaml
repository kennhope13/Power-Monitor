api:
  listen: ":1984"
  origin: "*"   # Cho phép mọi origin (dev). Production restrict cụ thể.

# Không hardcode streams ở đây.
# Backend StationOS là nguồn sự thật duy nhất:
#   - Thêm camera → PUT /api/streams tự động
#   - Xóa camera  → DELETE /api/streams tự động
#   - Restart backend → SyncAllCamerasToGo2RtcAsync() tái đăng ký toàn bộ

webrtc:
  listen: ":8555"

rtsp:
  listen: ":8554"

# FFmpeg transcoding H265→H264 cho WebRTC (go2rtc image tự tìm ffmpeg trong PATH)

