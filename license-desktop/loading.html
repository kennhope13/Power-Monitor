<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đang khởi động...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: #fafafa;
      user-select: none;
    }
    .logo {
      font-size: 64px;
      margin-bottom: 24px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      color: #ff4b4b;
    }
    p {
      font-size: 14px;
      color: #8d9faf;
      margin-bottom: 36px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #1e2530;
      border-top-color: #ff4b4b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .hint {
      position: absolute;
      bottom: 24px;
      font-size: 12px;
      color: #4a5568;
    }
  </style>
</head>
<body>
  <div class="logo">⚡</div>
  <h1>StationOS License Generator</h1>
  <p>Đang khởi động Giftcode Engine...</p>
  <div class="spinner"></div>
  <div class="hint">Vui lòng chờ trong giây lát</div>
</body>
</html>
